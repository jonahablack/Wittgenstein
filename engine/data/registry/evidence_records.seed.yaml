      injected counterfactual/conflicting documents.
    dataset_or_corpus: >
      18 RAG subsets built on NQ, SimpleQA, ASQA, BioASQ, FreshQA, ExpertQA,
      MultiFieldQA, HotpotQA, MuSiQue, MultiHop-RAG, ELI5, RobustQA, CRAG, and
      GPT-4o-synthesized counterfactual documents (for the conflict robustness
      subset specifically, built on NQ/TriviaQA/PopQA).
    experimental_envelope:
      rag_presence: true
      task_type: "reward_model_benchmark_for_rag_preference_alignment"
    intervention_or_comparison: >
      45 reward models (discriminative/generative/implicit) are scored on their
      ability to correctly rank pairs of RALM-generated responses, per subset,
      including the conflict-robustness subset (GPT-4o-synthesized counterfactual
      documents injected as retrieved context).
    outcome_metrics:
      - "Reward-model preference accuracy per subset (Table 2)"
      - "Consistency with human annotations (Pearson correlation, Table 1)"
    effect_size_text: >
      Best-performing reward model (Skywork-Critic-Llama-3.1-70B) reaches 78.3%
      overall accuracy across all RAG-RewardBench subsets; on the harmlessness
      "Conflict" column specifically it scores 82.3/100 (Table 2) -- short of
      perfect even for the strongest model tested, indicating conflict-robustness
      judgment remains an unsolved evaluation dimension.
    statistical_evidence: >
      Pearson correlation coefficient of 0.79 between judgment models used for
      preference annotation (page 17066); inter-annotator consistency with human
      preferences averaged 0.864 (Table 1) across three graduate-level annotators.
    stated_limitations: >
      This is a reward-model benchmark, not a direct measurement of production
      RALM conflict-resolution failure rates: the "conflict robustness" subset
