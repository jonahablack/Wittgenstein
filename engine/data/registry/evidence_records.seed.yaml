evidence_records:
  - id: EV-RET_HARD_DISTRACTOR-001
    failure_mechanism_id: RET_HARD_DISTRACTOR
    full_citation: >
      Amiraz, C., Cuconasu, F., Filice, S., and Karnin, Z. "The Distracting Effect:
      Understanding Irrelevant Passages in RAG." Proceedings of the 63rd Annual
      Meeting of the Association for Computational Linguistics (Volume 1: Long
      Papers), pp. 18228-18258. ACL, 2025.
    title: "The Distracting Effect: Understanding Irrelevant Passages in RAG"
    authors: ["Chen Amiraz", "Florin Cuconasu", "Simone Filice", "Zohar Karnin"]
    venue: "ACL 2025 (Volume 1: Long Papers)"
    publication_year: 2025
    peer_review_status: peer_reviewed
    persistent_identifier: null
    source_url: null
    exact_quote: >
      Both weak and hard distracting passages affect accuracy when compared to
      having only a gold document in the prompt, however, the impact of hard
      distracting passages is significantly larger, making the accuracy drop from 6
      to 11 accuracy points, depending on the LLM. Notably, this degradation
      persists even for larger LLMs, like Llama-3.3-70B.
    quote_location: >
      Section 4.4 ("Prompting with Relevant and Distracting Passages"), page 18234,
      main text following Table 1.
    quote_type: finding_statement
    study_type: controlled_comparison
    direction: supports
    task: >
      Open-domain question answering; LLM prompted with a gold (answer-bearing)
      passage combined with a distracting passage. Headline result is on NQ
      (Table 1); the paper's broader distracting-effect measurement also spans
      TriviaQA, PopQA, and WebQA.
    dataset_or_corpus: "Natural Questions (NQ), TriviaQA, PopQA, WebQA"
    experimental_envelope:
      rag_presence: true
      generator_family: "Llama-3.2/3.1/3.3, Falcon-3, Qwen-2.5 (multiple parameter sizes, 3B-70B)"
    intervention_or_comparison: >
      Within-prompt comparison: gold passage only vs. gold passage + a hard
      distracting passage (query-related, non-supporting; distracting effect > 0.8)
      vs. gold passage + a weak distracting passage (distracting effect < 0.2),
      averaged over both orderings (gold-first and distractor-first) to control for
      position bias.
    outcome_metrics: ["Answer accuracy (exact match to gold answer)"]
    effect_size_text: >
      Accuracy drop of 6 to 11 percentage points when a hard distracting passage is
      added to a prompt already containing the gold passage, vs. gold-only (Table
      1: e.g. Llama-3.2-3B 82.6% -> 71.5%; Llama-3.1-8B 80.6% -> 73.9%).
    statistical_evidence: >
      Wilcoxon signed-rank test, p < 0.01, reported significant for the Gold+HD vs.
      Gold-only comparison across the LLMs in Table 1 (values not underlined in
      Table 1 are reported as statistically significant).
    stated_limitations: >
      Distracting effect is measured per-LLM via a probability-of-non-abstention
      score; the paper notes distracting-effect scores correlate strongly but not
      perfectly across LLMs (Figure 4), so magnitude may vary by model family. The
      quoted 6-11 point drop is the NQ result specifically; similar trends are
      reported for TriviaQA/PopQA/WebQA but their exact accuracy-point drops were
      not extracted in this pass. Second-review pass (2026-09-09, same day, solo
      contributor): quote and Table 1 figures re-checked against the source images
      captured during extraction; agreement_status=verified_agreement, no
      corrections.
    evidence_grade: A2_strong_comparative_peer_reviewed
    extraction_reviewer: "Claude Code literature-review pass, 2026-09-09"
    extraction_date: "2026-09-09"
    verification_status: verified

  - id: EV-RET_MULTIHOP_SUPPORT_INCOMPLETE-001
    failure_mechanism_id: RET_MULTIHOP_SUPPORT_INCOMPLETE
    full_citation: >
      Tang, Y. and Yang, Y. "MultiHop-RAG: Benchmarking Retrieval-Augmented
      Generation for Multi-Hop Queries." arXiv:2401.15391 (2024). Publicly reported
      as accepted at COLM 2024, but that acceptance is not confirmed within the
      arXiv preprint PDF examined in this pass -- treated conservatively as an
      unconfirmed-peer-review preprint (see peer_review_status/evidence_grade).
    title: "MultiHop-RAG: Benchmarking Retrieval-Augmented Generation for Multi-Hop Queries"
    authors: ["Yixuan Tang", "Yi Yang"]
    venue: "arXiv preprint (COLM 2024 acceptance publicly reported but not confirmed from this document)"
    publication_year: 2024
    peer_review_status: preprint
    persistent_identifier: "arXiv:2401.15391"
    source_url: null
    exact_quote: >
      the response accuracy rate using the retrieved chunks is not satisfactory,
      with the state-of-the-art GPT-4 model achieving only 0.56 accuracy. This is
      expected, because the retrieval component falls short in retrieving relevant
      evidences from the knowledge base.
    quote_location: >
      Section 4.2 ("Generation-related Task"), page 6, main text following Table 6.
    quote_type: finding_statement
    study_type: controlled_comparison
    direction: supports
    task: >
      Multi-hop question answering over a RAG pipeline (LlamaIndex), comparing
      generation accuracy when fed retrieved (imperfect) evidence vs. ground-truth
      (complete) evidence for the same multi-hop queries.
    dataset_or_corpus: >
      MultiHop-RAG (this paper's own dataset: English news-article knowledge base,
      2,556 multi-hop queries requiring 2-4 evidence pieces per Table 4).
    experimental_envelope:
      rag_presence: true
      task_type: "multi_hop_question_answering"
      generator_family: "GPT-4, ChatGPT (GPT-3.5), Claude-2.1, Google-PaLM, Llama2-70b-chat, Mixtral-8x7B-Instruct"
      retriever_family: "dense embedding retrieval (voyage-02 best-performing) with bge-reranker-large"
      candidate_depth: 6
    intervention_or_comparison: >
      Same multi-hop queries answered under two evidence conditions: (1) top-6
      retrieved chunks from the full RAG pipeline, vs. (2) the ground-truth
      supporting evidence set for the query (a ceiling/oracle condition).
    outcome_metrics:
      - "Response accuracy (Table 6)"
      - "MRR@10 / MAP@10 / Hits@10 / Hits@4 (Table 5, retrieval quality)"
    effect_size_text: >
      GPT-4 generation accuracy: 0.56 with retrieved chunks vs. 0.89 with
      ground-truth chunks (Table 6) -- a 0.33 absolute accuracy gap attributable to
      incomplete/imperfect retrieved support. Best retrieval configuration
      (voyage-02 + bge-reranker-large) reaches only Hits@10=0.7467, Hits@4=0.6625
      (Table 5).
    statistical_evidence: null
    stated_limitations: >
      Benchmark/observational comparison across two evidence conditions, not a
      per-item randomized intervention; ground-truth evidence for a query is capped
      at 4 pieces (paper's own stated Limitations section), so may understate
      difficulty of queries needing more evidence. Peer-review status of this
      specific document could not be confirmed (see venue note above) --
      evidence_grade lowered from the seed's original A2 to C accordingly, per this
      project's rule that A1/A2 require peer_review_status=peer_reviewed
      (schemas/evidence.py::EvidenceRecord._a_grade_requires_peer_review).
      Second-review pass (2026-09-09, same day, solo contributor): the full
      14-page document (not just the pages sampled in the first pass) was
      re-read specifically to search for a COLM 2024 proceedings/camera-ready
      marking; none was found anywhere in the paper, including its final page.
      This re-confirms, rather than merely repeats, the preprint classification.
      agreement_status=verified_agreement, no corrections.
    evidence_grade: C_preprint_empirical
    extraction_reviewer: "Claude Code literature-review pass, 2026-09-09"
    extraction_date: "2026-09-09"
    verification_status: verified

  - id: EV-CTX_POSITION_SENSITIVE_USE-001
    failure_mechanism_id: CTX_POSITION_SENSITIVE_USE
    full_citation: >
      Liu, N.F., Lin, K., Hewitt, J., Paranjape, A., Bevilacqua, M., Petroni, F., and
      Liang, P. "Lost in the Middle: How Language Models Use Long Contexts."
      Transactions of the Association for Computational Linguistics, vol. 12, pp.
      157-173, 2024. https://doi.org/10.1162/tacl_a_00638
    title: "Lost in the Middle: How Language Models Use Long Contexts"
    authors: ["Nelson F. Liu", "Kevin Lin", "John Hewitt", "Ashwin Paranjape", "Michele Bevilacqua", "Fabio Petroni", "Percy Liang"]
    venue: "Transactions of the Association for Computational Linguistics (TACL), vol. 12"
    publication_year: 2024
    peer_review_status: peer_reviewed
    persistent_identifier: "10.1162/tacl_a_00638"
    source_url: null
    exact_quote: >
      We find that changing the position of relevant information in the input
      context can substantially affect model performance, indicating that current
      language models do not robustly access and use information in long input
      contexts. Furthermore, we observe a distinctive U-shaped performance curve
      (Figure 1); language model performance is highest when relevant information
      occurs at the very beginning (primacy bias) or end of its input context
      (recency bias), and performance significantly degrades when models must
      access and use information located in the middle of their input context.
    quote_location: "Section 1 (Introduction), page 158."
    quote_type: finding_statement
    study_type: causal_intervention
    direction: supports
    task: >
      Multi-document question answering (controlled placement of the single
      answer-bearing document within a fixed-size input context) and a synthetic
      key-value retrieval task.
    dataset_or_corpus: >
      NaturalQuestions-Open (2,655 queries with paragraph-length annotated long
      answers); k-1 distractor Wikipedia passages retrieved via Contriever
      fine-tuned on MS-MARCO.
    experimental_envelope:
      rag_presence: false
      task_type: "long_context_question_answering"
      generator_family: "MPT-30B-Instruct, LongChat-13B (16K), GPT-3.5-Turbo, Claude-1.3"
    intervention_or_comparison: >
      Position of the single answer-bearing document is systematically placed at
      the beginning, middle, or end of a fixed set of k documents, with k varied to
      control input context length. The distractor documents are retrieved, but the
      position manipulation itself is a controlled placement, not a retrieval
      outcome -- hence a causal intervention on position specifically.
    outcome_metrics:
      - "Multi-document QA accuracy as a function of answer-document position"
      - "Synthetic key-value retrieval accuracy"
    effect_size_text: >
      With relevant information in the middle of the input context,
      GPT-3.5-Turbo's multi-document QA accuracy is lower than its closed-book
      (no-documents) accuracy of 56.1%. With 20 total retrieved documents (~4K
      tokens), accuracy peaks near the y-axis maximum (~75%) when the answer
      document is 1st and falls back toward the closed-book baseline (~56-57%) for
      middle positions (Figure 1).
    statistical_evidence: null
    stated_limitations: >
      Direct long-context finding using a fixed, non-retrieved document set
      (rag_presence=false) -- not a RAG-specific experiment. Extended-context
      models were found "not necessarily better" at this task than shorter-context
      counterparts; encoder-decoder models were relatively robust only within their
      training-time sequence length. A separate retriever-reader case study
      (Section 5) on NaturalQuestions-Open finds performance saturates before
      retriever recall saturates (~1.5% gain from 20 to 50 documents for
      GPT-3.5-Turbo, ~1% for Claude-1.3) -- RAG-flavored but distinct from the core
      controlled-position experiment, and not the finding quoted above.
      Second-review pass (2026-09-09, same day, solo contributor): quote,
      DOI, and rag_presence=false classification re-checked against the source
      images captured during extraction; agreement_status=verified_agreement, no
      corrections.
    evidence_grade: A1_direct_causal_peer_reviewed
    extraction_reviewer: "Claude Code literature-review pass, 2026-09-09"
    extraction_date: "2026-09-09"
    verification_status: verified

