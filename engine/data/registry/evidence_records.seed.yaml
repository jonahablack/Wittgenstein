      relevant but uncited documents (57%) and documents cited for different
      reasons (55%). Based on our results, we conjecture post-rationalization to
      be a common phenomenon.
    quote_location: >
      Section 5 ("Post-Rationalization - A Study of Unfaithful Behavior"),
      Results, page 11.
    quote_type: finding_statement
    study_type: causal_intervention
    direction: "null"
    task: >
      Attributed question answering with a RAG-optimized LLM (Cohere
