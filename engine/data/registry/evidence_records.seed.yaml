  - id: EV-PACK_OMISSION_OR_TRUNCATION-001
    failure_mechanism_id: PACK_OMISSION_OR_TRUNCATION
    full_citation: >
      Gabin, J., Perez, A., and Parapar, J. "Lost in the Evidence? Reproducing
      Document Position and Context Size Effects in RAG." Proceedings of the 49th
      International ACM SIGIR Conference on Research and Development in
      Information Retrieval (SIGIR '26), Melbourne, VIC, Australia.
      https://doi.org/10.1145/3805712.3808569
    title: "Lost in the Evidence? Reproducing Document Position and Context Size Effects in RAG"
    authors: ["Jorge Gabin", "Anxo Perez", "Javier Parapar"]
    venue: "SIGIR '26"
    publication_year: 2026
    peer_review_status: peer_reviewed
    persistent_identifier: "10.1145/3805712.3808569"
    source_url: null
    exact_quote: >
      both oracle-passages (all gold-relevant passages) and oracle-sents (only the
      sentences containing the answer) form the upper bound, clustering a bit
      above 0.70 F1 across k. This isolates the upper bound attributable to
      evidence quality, not the LLM capacity.
    quote_location: >
      Section 5.2 ("Impact of Retrieval Quality and Reranking", RQ2), page 6.
    quote_type: finding_statement
    study_type: controlled_comparison
    direction: supports
    task: >
      Question answering under a RAG pipeline, comparing model accuracy across
      evidence-quality conditions ranging from closed-book, through realistic
      BM25/reranked retrieval, up to oracle (complete gold-evidence) context, and
      across varied context sizes (number of retrieved passages).
    dataset_or_corpus: "Natural Questions (NQ) and HotpotQA (via their KILT-formatted and standard releases)."
    experimental_envelope:
      rag_presence: true
      generator_family: "LLaMA-3.1:8B, Mistral-Nemo:12B"
      retriever_family: "BM25; BM25+E5 dense reranking"
      candidate_depth: 100
    intervention_or_comparison: >
      Same queries and generator, evidence condition varied from closed-book (no
      retrieval) through BM25-retrieved top-k (k in {5,10,25,50,75,100}) up to
      oracle-passages/oracle-sents (complete gold-relevant evidence), isolating how
      much of the accuracy gap is attributable to incomplete/imperfect evidence
      versus generator capability.
    outcome_metrics: ["Token-level F1 (primary metric)"]
    effect_size_text: >
      On HotpotQA, oracle conditions (complete gold evidence) cluster just above
      0.70 F1 across all context sizes, while realistic BM25 retrieval remains
      substantially lower (roughly 0.45-0.50 F1, Figure 7) -- a large, persistent
      gap attributable to incomplete evidence reaching the generator, not model
      capacity.
    statistical_evidence: null
    stated_limitations: >
      This is an explicitly reproducibility-focused study: the authors find that
      context-size and ordering effects are more variable and topic-sample-
      dependent than prior work reported, and that "conclusions drawn from
      idealised setups do not always transfer to real-world RAG pipelines" (their
      own conclusion). It studies evidence completeness/quality broadly (oracle
      vs. realistic retrieval) rather than specifically instrumenting a
      selected-but-then-omitted-before-packing trace event; used here as
      motivating/background support for why omission matters, not as a direct
      trace-level replication. PACK_OMISSION_OR_TRUNCATION's own epistemic_status
