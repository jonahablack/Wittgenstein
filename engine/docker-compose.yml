services:
  api:
    build: .
    command: uv run uvicorn wittgenstein.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      WITTGENSTEIN_DATABASE_URL: sqlite:///./data/dev.db
      WITTGENSTEIN_REGISTRY_SEED_DIR: ./data/registry
