[project]
name = "wittgenstein-rag-reliability"
version = "0.1.0"
description = "A versioned, evidence-graded registry of experimentally investigated RAG failure mechanisms, with schemas and tooling to match a pipeline manifest and query trace to only the mechanisms whose experimental prerequisites are present."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Wittgenstein RAG Reliability contributors" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "typer>=0.13",
    "pyyaml>=6.0",
    "rich>=13.9",
    "llama-index-core>=0.12",
    "numpy>=2.0",
    "model2vec>=0.10",
    "sse-starlette>=3.0",
    "pypdf>=6.0",
    "spacy>=3.8,<3.9",
    "en-core-web-sm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
]
anthropic = [
    "anthropic>=2.0",
]
quality = [
    "fastembed>=0.9",
]
openai = [
    "openai>=2.0",
]

[project.scripts]
wittgenstein = "wittgenstein.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wittgenstein"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042: this codebase uses `(str, Enum)` pervasively (not `enum.StrEnum`) for its
# core vocabulary enums, matching Pydantic v2's documented pattern -- intentional.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
# Typer's documented usage pattern *is* `typer.Option(...)` / `typer.Argument(...)`
# as an argument default; these are effectively immutable factory calls, not mutable
# default pitfalls. Same reasoning for FastAPI's `Depends(...)` -- it is FastAPI's
# documented dependency-injection pattern, not a mutable-default bug.
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
