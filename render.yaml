# Wittgenstein on Render: one Docker web service (Dockerfile at the repo root) that
# builds the web app and runs the engine. Measured peak memory about 180 MB for a
# three-pipeline run, so the free plan's 512 MB is enough for a demo.
services:
  - type: web
    name: wittgenstein-cosmos
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: Cosmos
    autoDeploy: true
    healthCheckPath: /live/config
    envVars:
      # Optional: language-model answers in the app. Set in the Render dashboard, never in the repo.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Optional: require an API key for the public /v1 API (comma-separated).
      - key: WITTGENSTEIN_API_KEYS
        sync: false
