services:
  - type: web
    name: wittgenstein
    runtime: python
    plan: free
    buildCommand: "pip install -r server/requirements.txt && cd client && npm install && npm run build"
    startCommand: "cd server && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300"
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
